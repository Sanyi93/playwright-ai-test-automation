# Runs the Playwright test suite. Defined by specs/engineering/pipelines.md.
name: Run Playwright Tests

on:
  # 1. Whenever a pull request is opened (and when new commits are pushed to it)
  pull_request:
  # 2. Whenever changes are merged into main
  push:
    branches: [main]
  # 3. Manually, from the repository's Actions page
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same branch or pull request cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      # Caches the npm download cache, keyed by package-lock.json.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get the installed Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Playwright's browsers are reused until the Playwright version changes.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The browsers came from the cache, but the system packages they need
      # are not cached, so install those.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.ts starts the app (npm run dev) before the tests, and
      # prints results in the terminal and writes an HTML report.
      - name: Run Playwright tests
        run: npm test

      - name: Upload the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (traces, screenshots, error context)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
